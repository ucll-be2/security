info:
  name: Create new movie
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/movies"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "title": "Caught Stealing",
          "director": "Darren Aronofsky",
          "year": 2025
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: movieId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
