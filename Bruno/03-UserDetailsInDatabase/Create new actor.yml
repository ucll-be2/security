info:
  name: Create new actor
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/actors"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "name": "Jos Bosmans"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: actorId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
