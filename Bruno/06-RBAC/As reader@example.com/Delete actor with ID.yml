info:
  name: Delete actor with ID
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/actors/:actorId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: actorId
      value: "{{actorId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
