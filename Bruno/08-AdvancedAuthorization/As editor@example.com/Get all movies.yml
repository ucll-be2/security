info:
  name: Get all movies
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v1/movies"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
