info:
  name: Get other user's details (editor@example.com)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/:userId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: userId
      value: "{{editorId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
