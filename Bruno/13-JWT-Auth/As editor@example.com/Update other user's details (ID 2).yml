info:
  name: Update other user's details (ID 2)
  type: http
  seq: 3

http:
  method: PUT
  url: "{{host}}/api/v1/users/:user_id"
  params:
    - name: user_id
      value: "2"
      type: path
  body:
    type: json
    data: |-
      {
        "emailAddress": "changedreader@example.com",
        "password": "changedpassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

