info:
  name: Update own user's details (reader@example.com)
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/users/:userId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: userId
      value: "{{readerId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "emailAddress": "changedreader@example.com",
        "password": "changedpassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
