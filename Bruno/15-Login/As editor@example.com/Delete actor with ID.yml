info:
  name: Delete actor with ID
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{host}}/api/v1/actors/:actor_id"
  params:
    - name: actor_id
      value: "{{actor_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

