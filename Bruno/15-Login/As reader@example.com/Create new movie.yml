info:
  name: Create new movie
  type: http
  seq: 13

http:
  method: POST
  url: "{{host}}/api/v1/movies"
  body:
    type: json
    data: |-
      {
          "title": "Caught Stealing",
          "director": "Darren Aronofsky",
          "year": 2025
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

