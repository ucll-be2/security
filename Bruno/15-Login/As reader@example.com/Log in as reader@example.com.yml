info:
  name: Log in as reader@example.com
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sessions"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "emailAddress": "reader@example.com",
        "password": "reader"
      }

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: readerToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
  omitHeaders:
    - Accept
